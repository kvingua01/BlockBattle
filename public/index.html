<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>
        BlockBattle
    </title>

    <style>

        body {
            margin: 0;
            background: #15131d;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow-x: hidden;
        }

        h1 {
            margin-bottom: 5px;
        }

        p {
            margin: 6px;
        }

        canvas {
            display: block;
            margin: 15px auto 20px auto;

            background: #11111b;

            border: 4px solid white;

            max-width: 95vw;

            max-height: 78vh;

            width: auto;

            height: auto;
        }

        .other-games {
            margin: 25px auto 40px auto;
        }

        .other-games-title {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 12px;
        }

        .bobs-run-button {
            display: inline-block;

            padding: 13px 26px;

            background: #ffffff;
            color: #15131d;

            border: 3px solid #ffffff;
            border-radius: 8px;

            font-size: 18px;
            font-weight: bold;

            text-decoration: none;

            transition:
                background 0.15s ease,
                color 0.15s ease,
                transform 0.15s ease;
        }

        .bobs-run-button:hover {
            background: #15131d;
            color: #ffffff;

            transform: scale(1.05);
        }

    </style>

</head>

<body>

    <h1>
        BLOCK BATTLE
    </h1>

    <p>
        A/D or ←/→ = Move
        |
        W or ↑ = Jump
        |
        F = Sword / Green Fireball
        |
        G = Dash
    </p>

    <p>
        SPACE = Shove
        |
        Hold SPACE = Fireball
        |
        Collect Powerups = Get Stronger
    </p>

    <p>
        6+ Players = Large Map
    </p>

    <canvas
        id="gameCanvas"
        width="800"
        height="600">
    </canvas>


    <!-- =========================================
         OTHER GAMES
         ========================================= -->

    <div class="other-games">

        <div class="other-games-title">
            MORE FROM BOB'S GAME LOCKER
        </div>

        <a
            class="bobs-run-button"
            href="https://bobs-run.bobsgamelocker.com/"
        >
            🏁 PLAY BOB'S RUN
        </a>

    </div>


    <script src="/socket.io/socket.io.js"></script>

    <script src="game.js"></script>

</body>

</html>
